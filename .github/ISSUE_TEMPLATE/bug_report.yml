name: Bug report
description: Report an assessment, map, upload or startup problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private photos, exact personal locations or unredacted assessment exports.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you select or click?
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and visible error
      description: Operating system, Python and Node versions, browser, and error text with private information removed.
    validations:
      required: true
